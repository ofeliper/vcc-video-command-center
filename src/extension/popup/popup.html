<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>VCC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Textos: atributos data-i18n* recebem as traduções de js/i18n.js (chaves "pop.*"). -->
  <header>
    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <h1>VCC</h1>
    <span id="site" class="site"></span>
  </header>

  <!-- Página onde extensões não podem rodar (about:, loja de extensões etc.) -->
  <section id="unsupported" hidden>
    <p class="muted" data-i18n="pop.unsupported"></p>
  </section>

  <!-- Sem permissão para acessar o site -->
  <section id="no-access" hidden>
    <p class="status warn" data-i18n="pop.noAccess"></p>
    <p class="muted" data-i18n="pop.noAccessText"></p>
    <button id="grant-site" class="primary" data-i18n="pop.grantSite"></button>
    <button id="grant-all" data-i18n="pop.grantAll"></button>
    <div id="denied" class="help" hidden>
      <strong data-i18n="pop.deniedTitle"></strong>
      <span data-i18n="pop.deniedText"></span>
    </div>
  </section>

  <!-- Tem permissão, mas o script ainda não está na página -->
  <section id="needs-reload" hidden>
    <p class="status ok" data-i18n="pop.accessGranted"></p>
    <p class="muted" data-i18n="pop.reloadText"></p>
    <button id="reload" class="primary" data-i18n="pop.reload"></button>
  </section>

  <!-- Funcionando -->
  <section id="ready" hidden>
    <button id="open-panel" class="primary"><span data-i18n="pop.openPanel"></span> <kbd>H</kbd></button>
    <div class="row">
      <div>
        <div data-i18n="pop.videoControls"></div>
        <div id="active-label" class="muted small"></div>
      </div>
      <button id="toggle-site" class="switch" role="switch" aria-checked="false" data-i18n-aria-label="pop.videoControlsAria"><span></span></button>
    </div>
    <p id="reload-hint" class="help" hidden>
      <span data-i18n="pop.reloadHint"></span>
      <button id="reload-after-off" class="link" data-i18n="pop.reloadNow"></button>
    </p>
  </section>

  <footer id="access-footer" hidden>
    <span id="access-summary" class="muted small"></span>
    <button id="grant-all-footer" class="link small" hidden data-i18n="pop.allowAll"></button>
  </footer>

  <!-- Idioma: sempre visível, com os nomes no próprio idioma -->
  <div class="lang">
    <label for="language"><span aria-hidden="true">🌐</span> <span data-i18n="pop.language"></span></label>
    <select id="language"></select>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
